<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../iglib/library/tokens/fonts.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: #fff; font-family: Montserrat, sans-serif; }
  body.wm, html:has(body.wm) { background: transparent; }
  #card { position: absolute; left: 60px; right: 60px; }
  .who { display: flex; align-items: center; gap: 26px; }
  .who img { width: 116px; height: 116px; border-radius: 50%; }
  .name { font-size: 46px; font-weight: 700; color: #0f1419; line-height: 1.1; }
  .handle { font-size: 38px; font-weight: 500; color: #536471; line-height: 1.2; margin-top: 4px; }
  #hook { margin: 34px 0 0; font-size: 58px; font-weight: 500; line-height: 1.22; color: #0f1419; letter-spacing: -0.01em; }
  #wm { position: absolute; left: 0; right: 0; text-align: center; font-size: 50px; font-weight: 800; letter-spacing: -0.02em; color: rgb(255 255 255 / 0.55); text-shadow: 0 2px 8px rgb(0 0 0 / 0.35); }
</style></head>
<body>
<div id="card">
  <div class="who"><img src="logo/avatar-bolt.jpg"><div><div class="name">OnFin</div><div class="handle">@onfinkm</div></div></div>
  <p id="hook"></p>
</div>
<div id="wm" style="display:none">onfin</div>
</body></html>
