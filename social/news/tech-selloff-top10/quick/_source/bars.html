<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///tmp/claude-0/-home-user-onfin-blog/42b2fa22-784d-52c4-a9a8-6ec4971d0812/scratchpad/iglib/library/tokens/fonts.css">
<style>
:root{--lime:#9fce10;--coral:#fa876b;--ink:#0b0b0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink)}
body{font-family:'Montserrat',sans-serif;color:#fff;width:1080px;position:relative;overflow:hidden;
 background:radial-gradient(1200px 700px at 85% -10%, rgba(159,206,16,.13), transparent 60%),radial-gradient(900px 600px at -10% 110%, rgba(250,135,107,.10), transparent 60%),var(--ink)}
#wrap{position:absolute;left:64px;right:64px;display:flex;flex-direction:column}
.handle{display:flex;align-items:center;gap:14px;font-weight:700;font-size:26px;color:rgba(255,255,255,.92)}
.handle img{width:52px;height:52px;border-radius:50%}
.tag{align-self:flex-start;margin-top:34px;padding:9px 18px;border-radius:999px;background:var(--lime);color:#000;font-weight:800;font-size:22px;letter-spacing:.5px}
h1{margin-top:20px;font-weight:800;font-size:var(--h1,60px);line-height:1.08;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--lime)}
.sub{margin-top:16px;font-weight:600;font-size:27px;color:rgba(255,255,255,.72);line-height:1.3}
.rows{margin-top:34px;display:flex;flex-direction:column;gap:15px}
.row{display:grid;grid-template-columns:44px 1fr;align-items:center;column-gap:14px}
.rk{font-weight:800;font-size:24px;color:rgba(255,255,255,.45);text-align:right}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:25px;font-weight:700;margin-bottom:7px}
.lab .nm span{color:rgba(255,255,255,.55);font-weight:600;margin-left:8px}
.lab .vals{display:flex;gap:18px;align-items:baseline}
.lab .pc{color:var(--coral);font-weight:700}
.lab .usd{font-weight:800;color:#fff}
.track{height:22px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#c9583f,var(--coral))}
.foot{margin-top:30px;display:flex;flex-direction:column;gap:8px}
.src{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.08);font-size:19px;font-weight:600;color:rgba(255,255,255,.8)}
.src i{width:9px;height:9px;border-radius:50%;background:var(--lime);display:inline-block}
.risk{font-size:15px;color:rgba(255,255,255,.45);font-weight:500;line-height:1.35}
</style></head><body><div id="wrap"></div>
<script>
const D=JSON.parse(decodeURIComponent(location.hash.slice(1)));
document.body.style.height=D.h+'px';
const w=document.getElementById('wrap'); w.style.top=D.top+'px'; if(D.h1size) document.documentElement.style.setProperty('--h1',D.h1size+'px');
const max=Math.max(...D.rows.map(r=>r.v));
w.innerHTML=`<div class="handle"><img src="avatar-bolt.jpg">@onfinkm</div>
<div class="tag">${D.tag}</div><h1>${D.h1}</h1><div class="sub">${D.sub}</div>
<div class="rows">${D.rows.map((r,i)=>`<div class="row"><div class="rk">${i+1}</div><div><div class="lab"><div class="nm">${r.name}<span>$${r.t}</span></div><div class="vals"><span class="pc">${r.pc}</span><span class="usd">${r.usd}</span></div></div><div class="track"><div class="bar" style="width:${Math.max(4,r.v/max*100)}%"></div></div></div></div>`).join('')}</div>
<div class="foot"><div class="src"><i></i>${D.src}</div><div class="risk">${D.note}</div><div class="risk">${D.risk}</div></div>`;
</script></body></html>
