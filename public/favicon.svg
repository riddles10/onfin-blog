<!--
  Square favicon — "On" lockup extracted from public/logo.svg. Drops the
  "Fin" wordmark paths so the mark renders legibly in 16x16 / 32x32 tab
  slots instead of as a squashed strip. Brand colours match the source
  logo: black background, #B4E913 (lime) "On" letterforms.

  viewBox: original logo's "On" lockup sits roughly at x=0..98, y=0..46.
  Centred into a square 100x100 viewBox by translating down ~27 units
  (gives ~27 units of equal padding top and bottom around the 46-tall
  lockup). The wrapper <rect> draws the same brand-black background
  edge-to-edge so the favicon reads as a solid square at small sizes.
-->
