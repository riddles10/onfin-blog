---

version: "2.4"

name: ${PROJECT_PREFIX:-}${PROJECT_PREFIX:+-}marketing-blog

services:
  app:
    image: IMAGE_NAME_PLACEHOLDER
    environment:
      PORT: "3000"
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    pids_limit: 1024        # TODO: revisit this limit after launching beta and monitoring actual usage
    cpus: "1.00"            # TODO: revisit this limit after launching beta and monitoring actual usage
    mem_limit: "1024m"      # TODO: revisit this limit after launching beta and monitoring actual usage
    memswap_limit: "1024m"  # TODO: revisit this limit after launching beta and monitoring actual usage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "32m"
        max-file: "4"

  cron-worker:
    depends_on:
      app:
        condition: service_healthy
    image: IMAGE_NAME_PLACEHOLDER
    environment:
      CRON_TARGET_BASE_URL: "http://app:3000" # The worker calls back into the app over the docker network
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?}
    command: ["node", "scripts/cron-worker.js"]
    restart: unless-stopped
    pids_limit: 1024        # TODO: revisit this limit after launching beta and monitoring actual usage
    cpus: "1.00"            # TODO: revisit this limit after launching beta and monitoring actual usage
    mem_limit: "1024m"      # TODO: revisit this limit after launching beta and monitoring actual usage
    memswap_limit: "1024m"  # TODO: revisit this limit after launching beta and monitoring actual usage
    # Disable the inherited image-level HEALTHCHECK from the Dockerfile.
    # That probe pings /api/health, which only the `app` service serves —
    # the cron-worker is a plain Node process with no HTTP listener, so
    # the probe was always failing and `docker compose up --wait` was
    # exiting 1 with "container ... is unhealthy".
    healthcheck:
      disable: true
    logging:
      options:
        max-size: "32m"
        max-file: "4"
