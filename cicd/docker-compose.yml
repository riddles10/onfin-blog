---

version: "2.4"

name: ${PROJECT_PREFIX:-}${PROJECT_PREFIX:+-}marketing-blog

services:
  app:
    image: IMAGE_NAME_PLACEHOLDER
    container_name: ${PROJECT_PREFIX:-}${PROJECT_PREFIX:+-}marketing-blog-app
    hostname: ${PROJECT_PREFIX:-}${PROJECT_PREFIX:+-}marketing-blog-app
    environment:
      PORT: "3000"
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    pids_limit: 512
    cpus: "0.75"
    mem_limit: "2048m"
    memswap_limit: "2048m"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "32m"
        max-file: "4"

  cron-worker:
    depends_on:
      app:
        condition: service_healthy
    image: IMAGE_NAME_PLACEHOLDER
    container_name: ${PROJECT_PREFIX:-}${PROJECT_PREFIX:+-}marketing-blog-cron-worker
    hostname: ${PROJECT_PREFIX:-}${PROJECT_PREFIX:+-}marketing-blog-cron-worker
    environment:
      CRON_TARGET_BASE_URL: "http://app:3000" # The worker calls back into the app over the docker network
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?}
    command: ["node", "scripts/cron-worker.js"]
    restart: unless-stopped
    pids_limit: 512
    cpus: "0.75"
    mem_limit: "1024m"
    memswap_limit: "1024m"
    # Replace the inherited image-level HEALTHCHECK with a trivial
    # always-true probe.
    #
    # Why not `disable: true`: the runner's `docker compose up --wait`
    # refuses services with no healthcheck at all ("has no healthcheck
    # configured") — it needs *something* to wait on.
    #
    # Why not the inherited probe: it pings /api/health, which only the
    # `app` service serves; the cron-worker is a plain Node process with
    # no HTTP listener, so that probe always fails.
    #
    # The cron-worker's real liveness signal is the container's running
    # state — if the node process exits, the container exits, and
    # `restart: unless-stopped` brings it back. Mapping that to a "true"
    # healthcheck is the cleanest expression of "as long as we're
    # running, we're healthy."
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 5s
    logging:
      options:
        max-size: "32m"
        max-file: "4"
